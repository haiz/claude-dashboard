[package]
name = "claude-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true


[dependencies]
slint = { version = "1", features = ["raw-window-handle-06"] }
claude-dashboard-core.workspace = true
window-vibrancy = "0.5"
