[package]
name = "claude-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true


[dependencies]
slint = { version = "1", features = ["raw-window-handle-06"] }
claude-dashboard-core.workspace = true
window-vibrancy = "0.5"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
tray-icon = "0.24.2"
tiny-skia = "0.12.0"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1"
