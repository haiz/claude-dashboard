[workspace]
resolver = "2"
members = ["core", "helper"]

[workspace.package]
edition = "2021"
version = "1.20.0"   # kept in sync with /VERSION by scripts/sync-version.sh
# Floor was 1.88 from the dependency graph (`time`, the `icu_*` crates); raised
# to 1.89 by `core`'s use of `std::fs::File::lock` (stable 1.89), which the
# Windows store lock needs. clippy's incompatible-msrv lint enforces this.
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
