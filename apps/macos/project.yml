name: ClaudeDashboard
options:
  bundleIdPrefix: com.claude-dashboard
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.3"
  minimumXcodeGenVersion: "2.40"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  ClaudeDashboard:
    type: application
    platform: macOS
    sources:
      - ClaudeDashboard
      - Shared
    settings:
      base:
        INFOPLIST_FILE: ClaudeDashboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.claude-dashboard.app
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - sdk: IOKit.framework
  ClaudeDashboardHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
      - Shared
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: claude-dashboard-helper
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - sdk: IOKit.framework
  ClaudeDashboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClaudeDashboardTests
    dependencies:
      - target: ClaudeDashboard
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClaudeDashboard.app/Contents/MacOS/ClaudeDashboard"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  # Second bundle, no TEST_HOST: it compiles Helper/ and Shared/ directly so the
  # helper CLI is reachable from `xcodebuild test`. It also depends on the helper
  # target (without linking it) so the real binary is built for the transport
  # tests, which spawn it.
  ClaudeDashboardHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - HelperTests
      - path: Helper
        excludes: [main.swift]
      - Shared
      - ClaudeDashboardTests/TestSupport
    dependencies:
      - target: ClaudeDashboardHelper
        link: false
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
