name: release-linux

# Guardrails, from docs/superpowers/specs/2026-08-30-linux-tauri-port-design.md:231-247.
# A previous workflow (deleted in cab82a9) recreated the release and replaced its
# assets after release.sh had uploaded its own, which broke every brew install.
#   1. published-release trigger, never a tag push
#   2. uploads only — never creates or replaces a release
#   3. never touches ClaudeDashboard.app.zip or claude-dashboard-cli.tar.gz
#   4. never writes release notes
#   5. never commits anything back into the repository
#
# --clobber below is only safe while no Linux asset checksum is pinned in any
# manifest (Formula/, Casks/, or a future Linux package manifest). The moment
# one is, --clobber recreates the exact cab82a9 hazard — an upload racing a
# pinned checksum. If that ever changes, this workflow must stop clobbering,
# or the checksum computation has to move into release.sh instead.
#
# workflow_dispatch (the retry path, for when a build fails after the release
# already published and the `published` event can't fire again) resolves the
# ref asymmetrically on purpose: the workflow *definition* that runs is
# whatever ref the dispatch itself was triggered from (normally the default
# branch), but checkout below is pinned to inputs.tag — so a fixed workflow
# re-runs against the tree that was actually released, not against whatever
# HEAD has moved to since.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build from and upload to (e.g. v1.17.0). Retry path only."
        required: true

permissions:
  contents: write

jobs:
  build:
    # Keyed on tag + arch: a republish, or an overlapping manual dispatch for
    # the same tag, must not race another run's --clobber upload.
    concurrency:
      group: release-linux-${{ github.event.release.tag_name || inputs.tag }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Tag names are attacker-influenceable (anyone who can push a tag or
      # trigger workflow_dispatch chooses this string) and permit shell
      # metacharacters ($, `, ;, &, |, (, )). ${{ }} is substituted into the
      # run: body as raw text before bash parses it, so both values are
      # routed through env: and read back as shell variables instead of being
      # interpolated directly into the script.
      - name: Resolve tag
        id: resolve
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          fi

      # ref is explicit on purpose: the release event defaults to the tag, but
      # workflow_dispatch defaults to the default branch, which would build a
      # different tree than the one being released.
      #
      # persist-credentials: false — nothing in this job pushes, and cargo
      # runs build.rs / proc-macro code from dependencies during the build and
      # test steps below; the contents:write token has no business surviving
      # in .git/config while third-party code executes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      # build-linux.sh (Task 2) does not install the musl target or musl-tools
      # itself; it assumes the toolchain is already in place.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # rustup only auto-installs a missing pinned toolchain on >= 1.28.1 and
      # only when RUSTUP_AUTO_INSTALL is unset, so install it explicitly rather
      # than depending on the runner image. With no argument this installs the
      # active toolchain — the 1.98.0 pin in apps/linux/rust-toolchain.toml,
      # with its components = ["clippy"].
      - name: Install pinned toolchain
        run: cd apps/linux && rustup toolchain install --no-self-update

      # rust-toolchain.toml lives in apps/linux and pins 1.98.0; rustup run from
      # the repo root would target the default toolchain instead.
      - name: Add musl target
        run: cd apps/linux && rustup target add ${{ matrix.arch }}-unknown-linux-musl

      - name: Clippy
        run: cd apps/linux && cargo clippy --workspace --all-targets --locked --target ${{ matrix.arch }}-unknown-linux-musl -- -D warnings

      # --target makes the test binaries the configuration that actually ships:
      # SQLite compiled through musl-gcc, ring's asm for this arch, static
      # linking. musl-static binaries run fine on the glibc runner.
      - name: Test
        run: cd apps/linux && cargo test --workspace --locked --target ${{ matrix.arch }}-unknown-linux-musl

      - name: Build artifact
        run: ./scripts/build-linux.sh ${{ matrix.arch }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release upload "$TAG" ".build/claude-dashboard-cli-linux-${{ matrix.arch }}.tar.gz" --clobber
