name: release

# Cut a release from any machine: Actions > release > Run workflow, with the new version
# and optional notes. It runs scripts/release.sh unchanged on a macOS runner (bump, build,
# test, artifacts, Homebrew sha256, commit, tag, push, gh release create), so that script
# stays the one place the release logic lives and can still be run by hand on a Mac.
#
# A release created with GITHUB_TOKEN does not fire `release: published` (GitHub's rule
# against workflow loops), so release-linux.yml and release-windows.yml are started here
# through their workflow_dispatch retry path, which GITHUB_TOKEN may trigger.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, X.Y.Z (e.g. 1.31.0)"
        required: true
      notes:
        description: "Release notes; write \\n between bullets (empty = GitHub's generated notes)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # release.sh signs with the pinned release certificate and stops if it is
      # missing. A throwaway keychain on the search list is all codesign needs; the
      # self-signed certificate does not have to be trusted.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release-signing.keychain-db"
          KC_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/release-signing.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

      - name: Run release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          # CDReleaseDate is the maintainer's day, not the runner's UTC one.
          TZ: Asia/Ho_Chi_Minh
        run: |
          if [ -n "$NOTES" ]; then
            ./scripts/release.sh "$VERSION" --notes "$(printf '%b' "$NOTES")"
          else
            ./scripts/release.sh "$VERSION"
          fi

      - name: Build Linux and Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run release-linux.yml --ref main -f tag="v$VERSION"
          gh workflow run release-windows.yml --ref main -f tag="v$VERSION"
