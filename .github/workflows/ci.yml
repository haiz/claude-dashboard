name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Test and lint apps/linux (core + helper)
        working-directory: apps/linux
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test core on Windows
        working-directory: apps/linux
        run: cargo test -p claude-dashboard-core
      - name: Test and lint the Windows bridge workspace
        working-directory: apps/windows
        run: |
          cargo test --workspace
          cargo clippy --all-targets -- -D warnings
      - name: Test the browser extension
        working-directory: apps/windows/extension
        run: node --test
